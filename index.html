<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accounting App Builder</title>
  <meta name="description" content="Answer a few questions about how you track your money and get a ready-to-use build prompt for an AI coding agent.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M9 22V12m7 10V8m7 14v-6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M9 22V12m7 10V8m7 14v-6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      </span>
      <div>
        <div class="brand-name">Accounting App Builder</div>
        <div class="brand-sub">Design your own money-tracking app — no code required</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="save-indicator" id="saveIndicator" aria-live="polite"></span>
      <button class="btn btn-ghost" id="resetBtn" type="button">Start over</button>
      <button class="btn btn-secondary" id="previewBtn" type="button" aria-expanded="false" aria-controls="previewDrawer">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Peek at prompt</span>
      </button>
    </div>
  </header>

  <div class="mobile-progress" id="mobileProgress"></div>

  <div class="layout">
    <nav class="stepper" id="stepper" aria-label="Wizard steps"></nav>
    <main class="content">
      <form id="wizard" autocomplete="off" novalidate></form>
      <div class="nav-row" id="navRow"></div>
    </main>
  </div>

  <aside class="drawer" id="previewDrawer" aria-hidden="true" aria-label="Live prompt preview">
    <div class="drawer-head">
      <div>
        <div class="drawer-title">Live preview</div>
        <div class="drawer-sub">Updates as you type. Finish the steps for the full version.</div>
      </div>
      <button class="icon-btn" id="closePreview" type="button" aria-label="Close preview">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <textarea class="prompt-box" id="drawerText" readonly spellcheck="false"></textarea>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
